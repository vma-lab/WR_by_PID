# Evaluation backbone settings for the ViT-S/16 models.
#
# run_scenario1.sh (and so every command in reproduce/) overrides these
# keys on the command line; their values here are not used by the
# reported rows: dataset.image_size (IMAGE_SIZE; -1 = native resolution,
# no resizing or padding), dataset.max_image_size (MAX_IMAGE_SIZE),
# dataset.binarisation.enable and .mode (BINARISATION), tiling.overlap
# (OVERLAP for the evaluation windows, CODEBOOK_OVERLAP for the codebook
# fit), the aggregation block (run_scenario1.sh passes --method vlad
# --vlad_clusters 100) and training.num_workers (EMBED_WORKERS).
# SIMPLE_WINDOW=1 nulls tiling.max_padding_pct and tiling.min_stroke_pct,
# so every full window is kept; tiling.binary_ink_threshold is then only
# the default of --ink_threshold, which run_scenario1.sh always passes
# (INK_THRESHOLD, 0.04 unless a script sets it). With SIMPLE_WINDOW=0 the
# keep-filter of the tiling block applies (Appendix A).
# dataset.root_dir and model.checkpoint are not read by the evaluation
# (the weights come from BACKBONE). The Sauvola settings of
# dataset.binarisation (window, k, morph_open_kernel) and input_norm are
# used: they drive the foreground gate and, for binarised input, the
# input binarisation.
model:
  name: "extvit:vit_small_patch16_224"
  pretrained: false
  checkpoint: "checkpoints/reference/reference_vit_s16.pth"

  input_norm:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

dataset:
  root_dir: "data/wi_icdar_17_train_colour"
  image_size: 0
  tile_size: 224
  max_image_size: 0
  binarisation:
    enable: false
    mode: "filter"
    method: "sauvola"
    after_resize: true
    window: 51
    k: 0.2
    morph_open_kernel: 0
    input_norm: { mean: [1.0, 1.0, 1.0], std: [-1.0, -1.0, -1.0] }

tiling:
  tile_size: ${dataset.tile_size}
  patch_size: 16
  overlap: 0.5
  max_padding_pct: null
  min_stroke_pct: 0.04
  bg_percentile: 95
  bg_margin: 10
  canny_low: 100
  canny_high: 200
  binary_ink_threshold: 0.025

aggregation:
  method: "salad"
  salad:
    support_points: 64
    sinkhorn_reg: 0.05
    sinkhorn_iters: 100
    sinkhorn_tolerance: 1.0e-6
    update_iters: 5
    init: "kmeans++"
    cache: true
    sort_by_mass: true

training:
  batch_size: 256
  num_workers: 4
  seed: 42
  device: "cuda:0"
